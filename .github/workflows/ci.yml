name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow numpy pytest
          brew install poppler
      - name: Run offline tests
        run: python -m pytest tests/ -q
      - name: Run README smoke tests (network)
        run: python -m pytest tests/test_readme_commands.py --net -q
